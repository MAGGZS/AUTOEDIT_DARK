# Alembic — migrações de schema do FLAXY.
#
# A URL do banco NÃO fica aqui: ela vem de settings.py (variável DATABASE_URL),
# lida em migrations/env.py. Assim a mesma configuração serve para o SQLite
# local e para o PostgreSQL do Render, sem senha versionada.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
